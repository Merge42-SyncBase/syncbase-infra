name: syncbase

# The approved Round-1 capture dataset was indexed with this immutable
# search-profile value. A different threshold requires a clean database,
# re-index, and fresh retrieval evidence instead of an in-place rollout.
x-round1-minimum-score: &round1-minimum-score "0.62"

x-app: &app
  restart: unless-stopped

x-model-environment: &model-environment
  SYNCBASE_MODEL_PATH: /models/model.onnx
  SYNCBASE_TOKENIZER_PATH: /models/tokenizer.json
  SYNCBASE_ORT_LIBRARY_PATH: /runtime/${SYNCBASE_ORT_LIBRARY_FILE:?required}

services:
  roles:
    image: pgvector/pgvector@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      SYNCBASE_DB_HOST: ${SYNCBASE_DB_HOST:?required}
      SYNCBASE_DB_PORT: ${SYNCBASE_DB_PORT:-5432}
      SYNCBASE_POSTGRES_OWNER_PASSWORD: ${SYNCBASE_POSTGRES_OWNER_PASSWORD:?required}
      SYNCBASE_WEB_DB_PASSWORD: ${SYNCBASE_WEB_DB_PASSWORD:?required}
      SYNCBASE_WORKER_DB_PASSWORD: ${SYNCBASE_WORKER_DB_PASSWORD:?required}
      SYNCBASE_MCP_DB_PASSWORD: ${SYNCBASE_MCP_DB_PASSWORD:?required}
    volumes:
      - ./postgres:/opt/syncbase/postgres:ro
    entrypoint: ["/bin/sh", "/opt/syncbase/postgres/configure-roles.sh"]
    restart: "no"

  migrate:
    image: ${SYNCBASE_MIGRATE_IMAGE:-syncbase/migrate:local}
    environment:
      SYNCBASE_DATABASE_URL: postgres://syncbase:${SYNCBASE_POSTGRES_OWNER_PASSWORD:?required}@${SYNCBASE_DB_HOST:?required}:${SYNCBASE_DB_PORT:-5432}/${SYNCBASE_DB_NAME:-syncbase}?sslmode=${SYNCBASE_DB_SSLMODE:-require}
      SYNCBASE_MINIMUM_SCORE: *round1-minimum-score
    depends_on:
      roles:
        condition: service_completed_successfully
    restart: "no"

  permissions:
    image: pgvector/pgvector@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    environment:
      SYNCBASE_DB_HOST: ${SYNCBASE_DB_HOST:?required}
      SYNCBASE_DB_PORT: ${SYNCBASE_DB_PORT:-5432}
      SYNCBASE_POSTGRES_OWNER_PASSWORD: ${SYNCBASE_POSTGRES_OWNER_PASSWORD:?required}
    volumes:
      - ./postgres:/opt/syncbase/postgres:ro
    entrypoint: ["/bin/sh", "/opt/syncbase/postgres/apply-grants.sh"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  models:
    image: ${SYNCBASE_MODEL_FETCHER_IMAGE:-syncbase/model-fetcher:local}
    environment:
      SYNCBASE_ORT_LIBRARY_FILE: ${SYNCBASE_ORT_LIBRARY_FILE:?required}
    volumes:
      - models-data:/models
      - runtime-data:/runtime
    restart: "no"

  api:
    <<: *app
    image: ${SYNCBASE_API_IMAGE:-syncbase/api:local}
    user: "0:0"
    entrypoint: ["/usr/local/bin/syncbase-api-entrypoint"]
    environment:
      SYNCBASE_DATABASE_URL: postgres://syncbase_web:${SYNCBASE_WEB_DB_PASSWORD:?required}@${SYNCBASE_DB_HOST:?required}:${SYNCBASE_DB_PORT:-5432}/${SYNCBASE_DB_NAME:-syncbase}?sslmode=${SYNCBASE_DB_SSLMODE:-require}
      SYNCBASE_ORIGINAL_ROOT: /data/originals
      SYNCBASE_ADMIN_USERNAME: ${SYNCBASE_ADMIN_USERNAME:-admin}
      SYNCBASE_ADMIN_PASSWORD_BCRYPT: ${SYNCBASE_ADMIN_PASSWORD_BCRYPT:?required}
      SYNCBASE_COOKIE_SECURE: ${SYNCBASE_COOKIE_SECURE:-false}
      SYNCBASE_MINIMUM_SCORE: *round1-minimum-score
      SYNCBASE_WEB_ADDR: :8080
      SYNCBASE_MCP_URL: http://mcp:8081/mcp
      SYNCBASE_MCP_TOKEN_FILE: /run/secrets/mcp_client_token
      SYNCBASE_WORKER_READY_URL: http://worker:8082/readyz
    volumes:
      - originals:/data/originals
    secrets:
      - mcp_client_token
    depends_on:
      migrate:
        condition: service_completed_successfully
      permissions:
        condition: service_completed_successfully

  web:
    image: ${SYNCBASE_WEB_IMAGE:-syncbase/web:local}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  worker:
    <<: *app
    image: ${SYNCBASE_WORKER_IMAGE:-syncbase/worker:local}
    environment:
      <<: *model-environment
      SYNCBASE_DATABASE_URL: postgres://syncbase_worker:${SYNCBASE_WORKER_DB_PASSWORD:?required}@${SYNCBASE_DB_HOST:?required}:${SYNCBASE_DB_PORT:-5432}/${SYNCBASE_DB_NAME:-syncbase}?sslmode=${SYNCBASE_DB_SSLMODE:-require}
      SYNCBASE_ORIGINAL_ROOT: /data/originals
      SYNCBASE_MINIMUM_SCORE: *round1-minimum-score
      SYNCBASE_WORKER_ID: worker-1
      SYNCBASE_WORKER_POLL_INTERVAL: 1s
      SYNCBASE_WORKER_HEALTH_ADDR: :8082
    volumes:
      - originals:/data/originals
      - models-data:/models:ro
      - runtime-data:/runtime:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      permissions:
        condition: service_completed_successfully
      models:
        condition: service_completed_successfully

  mcp:
    <<: *app
    image: ${SYNCBASE_MCP_IMAGE:-syncbase/mcp:local}
    environment:
      <<: *model-environment
      SYNCBASE_DATABASE_URL: postgres://syncbase_mcp:${SYNCBASE_MCP_DB_PASSWORD:?required}@${SYNCBASE_DB_HOST:?required}:${SYNCBASE_DB_PORT:-5432}/${SYNCBASE_DB_NAME:-syncbase}?sslmode=${SYNCBASE_DB_SSLMODE:-require}
      SYNCBASE_MINIMUM_SCORE: *round1-minimum-score
      SYNCBASE_MCP_TOKEN_SHA256: ${SYNCBASE_MCP_TOKEN_SHA256:?required}
      SYNCBASE_MCP_ALLOWED_HOSTS: ${SYNCBASE_MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,mcp}
      SYNCBASE_MCP_ALLOWED_ORIGINS: ${SYNCBASE_MCP_ALLOWED_ORIGINS:-}
      SYNCBASE_PUBLIC_BASE_URL: ${SYNCBASE_PUBLIC_BASE_URL:?required}
      SYNCBASE_ORIGINAL_ROOT: /data/originals
      SYNCBASE_MCP_ADDR: :8081
    volumes:
      - originals:/data/originals:ro
      - models-data:/models:ro
      - runtime-data:/runtime:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      permissions:
        condition: service_completed_successfully
      models:
        condition: service_completed_successfully

volumes:
  originals:
  models-data:
  runtime-data:

secrets:
  mcp_client_token:
    file: ${SYNCBASE_MCP_TOKEN_FILE:?required}
