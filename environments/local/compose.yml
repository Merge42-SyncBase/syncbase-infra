name: syncbase

x-was-build: &was-build
  context: ../was
  dockerfile: Dockerfile
  secrets:
    - github_token

services:
  postgres:
    image: pgvector/pgvector@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    restart: unless-stopped
    environment:
      POSTGRES_DB: syncbase
      POSTGRES_USER: syncbase
      POSTGRES_PASSWORD: ${SYNCBASE_POSTGRES_OWNER_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncbase -d syncbase"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # roles/permissions/models are already defined in the base compose.yml;
  # this just adds the local-only wait on the postgres container above.
  roles:
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      <<: *was-build
      args:
        TARGET_PACKAGE: ./cmd/migrate

  api:
    build:
      <<: *was-build
      args:
        TARGET_PACKAGE: ./cmd/web
    environment:
      SYNCBASE_COOKIE_SECURE: "false"

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "${SYNCBASE_WEB_BIND_ADDRESS:-127.0.0.1}:${SYNCBASE_WEB_PORT:-8080}:8080"

  worker:
    build:
      <<: *was-build
      args:
        TARGET_PACKAGE: ./cmd/worker

  mcp:
    build:
      context: ../mcp
      dockerfile: Dockerfile
      secrets:
        - github_token
    ports:
      - "${SYNCBASE_MCP_BIND_ADDRESS:-127.0.0.1}:${SYNCBASE_MCP_PORT:-8081}:8081"

volumes:
  postgres-data:

secrets:
  github_token:
    file: ${SYNCBASE_GITHUB_TOKEN_FILE:?required}
