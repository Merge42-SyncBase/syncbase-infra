name: syncbase

services:
  postgres:
    image: pgvector/pgvector@sha256:d2ef61f42ef767baa5a1475393303cc235bcd92febd9d7014eddb48b41f3bad0
    restart: unless-stopped
    environment:
      POSTGRES_DB: syncbase
      POSTGRES_USER: syncbase
      POSTGRES_PASSWORD: ${SYNCBASE_POSTGRES_OWNER_PASSWORD:?required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncbase -d syncbase"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # roles/permissions/models/migrate/api/web/worker/mcp are already defined
  # in the base compose.yml and pull published GHCR images by default (see
  # SYNCBASE_*_IMAGE in .env). This overlay only adds the local Postgres
  # container above and its wiring. To build one of was/mcp/frontend from
  # your own local source instead of pulling, layer the matching
  # build-*.yml file on top (see README).
  roles:
    depends_on:
      postgres:
        condition: service_healthy

  api:
    environment:
      SYNCBASE_COOKIE_SECURE: "false"

  web:
    ports:
      - "${SYNCBASE_WEB_BIND_ADDRESS:-127.0.0.1}:${SYNCBASE_WEB_PORT:-8080}:8080"

  mcp:
    ports:
      - "${SYNCBASE_MCP_BIND_ADDRESS:-127.0.0.1}:${SYNCBASE_MCP_PORT:-8081}:8081"

volumes:
  postgres-data:
