# Optional overlay: build syncbase-was from your local checkout instead of
# pulling the published image. Requires syncbase-was checked out as the
# canonical sibling of syncbase-infra. Round-1 component modules are public,
# so the build is anonymous and does not accept a GitHub credential.
#
# Usage:
#   docker compose \
#     -f compose.yml \
#     -f environments/local/compose.yml \
#     -f environments/local/build-was.yml \
#     up --build
name: syncbase

x-was-build: &was-build
  context: ../syncbase-was
  dockerfile: Dockerfile

services:
  migrate:
    build:
      <<: *was-build
      args:
        TARGET_PACKAGE: ./cmd/migrate

  api:
    build:
      <<: *was-build
      args:
        TARGET_PACKAGE: ./cmd/web

  worker:
    build:
      <<: *was-build
      args:
        TARGET_PACKAGE: ./cmd/worker
