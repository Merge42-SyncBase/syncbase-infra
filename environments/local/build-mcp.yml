# Optional overlay: build syncbase-mcp from your local checkout instead of
# pulling the published image. Requires syncbase-mcp checked out as the
# canonical sibling of syncbase-infra. Round-1 component modules are public,
# so the build is anonymous and does not accept a GitHub credential.
#
# Usage:
#   docker compose \
#     -f compose.yml \
#     -f environments/local/compose.yml \
#     -f environments/local/build-mcp.yml \
#     up --build
name: syncbase

services:
  mcp:
    build:
      context: ../syncbase-mcp
      dockerfile: Dockerfile
