name: syncbase-prod

services:
  models:
    image: ${SYNCBASE_MODEL_FETCHER_IMAGE:?required}
    pull_policy: always

  migrate:
    image: ${SYNCBASE_MIGRATE_IMAGE:?required}
    pull_policy: always

  api:
    image: ${SYNCBASE_API_IMAGE:?required}
    pull_policy: always
    environment:
      SYNCBASE_COOKIE_SECURE: "true"

  web:
    image: ${SYNCBASE_WEB_IMAGE:?required}
    pull_policy: always
    ports:
      - "${SYNCBASE_WEB_BIND_ADDRESS:-127.0.0.1}:${SYNCBASE_WEB_PORT:-8080}:8080"

  worker:
    image: ${SYNCBASE_WORKER_IMAGE:?required}
    pull_policy: always

  mcp:
    image: ${SYNCBASE_MCP_IMAGE:?required}
    pull_policy: always
    ports:
      - "${SYNCBASE_MCP_BIND_ADDRESS:-127.0.0.1}:${SYNCBASE_MCP_PORT:-8081}:8081"
